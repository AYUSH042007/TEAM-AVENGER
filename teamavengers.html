  <style>

  <script>
    /* =========================================================================
       WEB AUDIO API SYNTHESIZER (No external audio dependencies)
       ========================================================================= */
    const SoundFX = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      },
      playClick() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(650, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch(e) {}
      },
      playAddToCart() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        } catch(e) {}
      },
      playSuccess() {
        try {
          this.init();
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const startTime = this.ctx.currentTime + i * 0.09;
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.22, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.35);
          });
        } catch(e) {}
      }
    };

    /* =========================================================================
       DYNAMIC 2D CANVAS TEXTURE GENERATORS (Bright & Airy Light Theme)
       ========================================================================= */

    function createRoundedRectPath(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

      ctx.fillText(`Selected Color:`, 60, 355);
      ctx.fillStyle = '#0F172A';
      ctx.font = 'bold 36px Segoe UI, sans-serif';
      ctx.fillText(`${colorObj.name}`, 330, 355);

      ctx.fillStyle = '#64748B';
      ctx.font = '36px Segoe UI, sans-serif';
      ctx.fillText(`Selected Size:`, 60, 425);
      ctx.fillStyle = '#0284C7';
      ctx.font = 'bold 36px Segoe UI, sans-serif';

      // Controls Labels

      ctx.font = 'bold 38px Segoe UI, sans-serif';
      ctx.fillText('COLOR OPTION', 60, 520);

      ctx.fillStyle = '#334155';
      ctx.font = 'bold 38px Segoe UI, sans-serif';
      ctx.fillText('SIZE OPTION', 60, 680);

    // 2. SHOPPING CART CANVAS
    function renderCartCanvas() {
      const canvas = document.getElementById('canvas-cart') || document.createElement('canvas');
      canvas.id = 'canvas-cart';
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, 1024, 1024);

      // Card Frame
      const bgGrad = ctx.createLinearGradient(0, 0, 0, 1024);
      bgGrad.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
      bgGrad.addColorStop(1, 'rgba(248, 250, 252, 0.98)');
      ctx.fillStyle = bgGrad;
      createRoundedRectPath(ctx, 20, 20, 984, 984, 40);
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#16A34A';
      ctx.stroke();

      // Header
      ctx.fillStyle = '#16A34A';
      ctx.font = 'bold 50px Segoe UI, sans-serif';
      ctx.fillText('🛒 SHOPPING CART', 60, 95);

      let subtotal = 0;
      let totalTax = 0;

      if (shoppingCart.length === 0) {
        ctx.fillStyle = '#64748B';
        ctx.font = '38px Segoe UI, sans-serif';
        ctx.fillText('Your cart is currently empty.', 60, 220);
        ctx.fillText('Select a product on the table and', 60, 280);
        ctx.fillText('click "ADD TO CART".', 60, 340);
      } else {
        let yPos = 150;
        shoppingCart.forEach((item, index) => {
          if (index >= 4) return; // Display up to 4 items

          const itemBasePrice = item.price * item.quantity;
          const itemTax = itemBasePrice * TAX_RATE;
          const itemTotal = itemBasePrice + itemTax;

          subtotal += itemBasePrice;
          totalTax += itemTax;

          // Item Row Card
          ctx.fillStyle = '#F1F5F9';
          createRoundedRectPath(ctx, 50, yPos, 924, 115, 16);
          ctx.fill();

          ctx.fillStyle = '#0F172A';
          ctx.font = 'bold 32px Segoe UI, sans-serif';
          ctx.fillText(`${item.name}`, 75, yPos + 42);

          ctx.fillStyle = '#475569';
          ctx.font = '26px Segoe UI, sans-serif';
          ctx.fillText(`Color: ${item.colorName}  |  Size: ${item.size}  |  Qty: ${item.quantity}`, 75, yPos + 84);

          // Price Calculation
          ctx.fillStyle = '#15803D';
          ctx.font = 'bold 30px Segoe UI, sans-serif';
          ctx.fillText(`₹${itemBasePrice}`, 520, yPos + 44);

          ctx.fillStyle = '#D97706';
          ctx.font = '24px Segoe UI, sans-serif';
          ctx.fillText(`Tax(3%): ₹${itemTax.toFixed(2)} ➔ Total: ₹${itemTotal.toFixed(2)}`, 520, yPos + 84);

          yPos += 130;
        });
      }

      const grandTotal = subtotal + totalTax;

      // Divider Line
      ctx.strokeStyle = '#CBD5E1';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(50, 720);
      ctx.lineTo(974, 720);
      ctx.stroke();

      // Summary Totals
      ctx.fillStyle = '#475569';
      ctx.font = '32px Segoe UI, sans-serif';
      ctx.fillText(`Subtotal (pre-tax):`, 60, 775);
      ctx.fillText(`₹${subtotal.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`, 450, 775);

      ctx.fillText(`Total Tax (3%):`, 60, 825);
      ctx.fillText(`₹${totalTax.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`, 450, 825);

      ctx.fillStyle = '#16A34A';
      ctx.font = 'bold 44px Segoe UI, sans-serif';
      ctx.fillText(`GRAND TOTAL:`, 60, 895);
      ctx.fillText(`₹${grandTotal.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`, 450, 895);

      updateAFrameTexture('#cart-panel-plane', canvas);
    }

    function updateAFrameTexture(planeSelector, canvas) {
      const plane = document.querySelector(planeSelector);
      if (!plane) return;

      let texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;

      const mesh = plane.getObject3D('mesh');
      if (mesh && mesh.material) {
        mesh.material.map = texture;
        mesh.material.transparent = true;
        mesh.material.needsUpdate = true;
      }
    }

    /* =========================================================================
       A-FRAME CUSTOM COMPONENTS
       ========================================================================= */

    // Billboard Component (faces camera on Y axis)
    AFRAME.registerComponent('billboard-y', {
      tick: function () {
        const cameraEl = this.el.sceneEl.camera;
        if (!cameraEl) return;
        const camPos = cameraEl.el.object3D.position;
        const targetPos = new THREE.Vector3(camPos.x, this.el.object3D.position.y, camPos.z);
        this.el.object3D.lookAt(targetPos);
      }
    });

    // Hover Highlight Component
    AFRAME.registerComponent('vr-hoverable', {
      schema: { scaleFactor: { type: 'number', default: 1.08 } },
      init: function () {
        const el = this.el;
        const defaultScale = el.getAttribute('scale') || { x: 1, y: 1, z: 1 };
        this.originalScale = { ...defaultScale };

        el.addEventListener('mouseenter', () => {
          SoundFX.playClick();
          el.setAttribute('animation__hover', {
            property: 'scale',
            to: `${this.originalScale.x * this.data.scaleFactor} ${this.originalScale.y * this.data.scaleFactor} ${this.originalScale.z * this.data.scaleFactor}`,
            dur: 200,
            easing: 'easeOutQuad'
          });
        });

        el.addEventListener('mouseleave', () => {
          el.setAttribute('animation__hover', {
            property: 'scale',
            to: `${this.originalScale.x} ${this.originalScale.y} ${this.originalScale.z}`,
            dur: 200,
            easing: 'easeOutQuad'
          });
        });
      }
    });

    // 3D Confetti Burst Component
    AFRAME.registerComponent('confetti-burst', {
      init: function () {
        this.particles = [];
        this.active = false;
      },
      trigger: function () {
        this.active = true;
        const count = 100;
        const colors = ['#0284C7', '#16A34A', '#D97706', '#E11D48', '#9333EA', '#38BDF8'];
        
        for (let i = 0; i < count; i++) {
          const geom = new THREE.PlaneGeometry(0.07, 0.07);
          const mat = new THREE.MeshBasicMaterial({
            color: new THREE.Color(colors[Math.floor(Math.random() * colors.length)]),
            side: THREE.DoubleSide
          });
          const p = new THREE.Mesh(geom, mat);
          
          p.position.set(
            (Math.random() - 0.5) * 1.5,
            2.2 + Math.random() * 0.5,
            -2.5 + (Math.random() - 0.5) * 1.5
          );

          p.velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 3,
            2 + Math.random() * 2.5,
            (Math.random() - 0.5) * 3
          );

          p.rotVelocity = new THREE.Vector3(
            Math.random() * 8,
            Math.random() * 8,
            Math.random() * 8
          );

          this.el.object3D.add(p);
          this.particles.push(p);
        }

        setTimeout(() => { this.cleanup(); }, 3500);
      },
      tick: function (time, delta) {
        if (!this.active) return;
        const dt = delta / 1000;
        this.particles.forEach(p => {
          p.position.addScaledVector(p.velocity, dt);
          p.velocity.y -= 4.5 * dt;
          p.rotation.x += p.rotVelocity.x * dt;
          p.rotation.y += p.rotVelocity.y * dt;
        });
      },
      cleanup: function () {
        this.active = false;
        this.particles.forEach(p => {
          this.el.object3D.remove(p);
          p.geometry.dispose();
          p.material.dispose();
        });
        this.particles = [];
      }
    });

    /* =========================================================================
       BUSINESS LOGIC & INTERACTION HANDLERS
       ========================================================================= */

    // Single Click vs Double Click Handler
    function handleProductClick(productId) {
      if (clickTimeout) {
        // Double Click -> Pick Up & Inspect
        clearTimeout(clickTimeout);
        clickTimeout = null;
        toggleInspectProduct(productId);
      } else {
        // Single Click -> Open Info Panel
        clickTimeout = setTimeout(() => {
          clickTimeout = null;
          selectProduct(productId);
        }, 250);
      }
    }

    // Select Product & Open Spec Panel
    function selectProduct(productId) {
      SoundFX.playClick();
      selectedProductId = productId;

      // Update Panel Position near selected product pedestal
      const panelGroup = document.getElementById('product-info-panel-group');
      if (panelGroup) {
        const pPositions = {
          shirt: '-1.4 1.95 -1.6',
          shoe: '0 1.95 -1.6',
          jeans: '1.4 1.95 -1.6'
        };
        panelGroup.setAttribute('position', pPositions[productId] || '0 1.95 -1.6');
        panelGroup.setAttribute('visible', 'true');
      }

      updateProductColorAndSizeButtons();
      renderProductInfoCanvas(productId);
    }

    // Pick Up & Rotate / Inspect Product
    function toggleInspectProduct(productId) {
      SoundFX.playClick();
      const entity = document.getElementById(`product-${productId}-model`);
      if (!entity) return;

      if (inspectedProductId === productId) {
        // Drop back to table
        inspectedProductId = null;
        entity.removeAttribute('animation__spin');
        entity.setAttribute('animation__lift', {
          property: 'position',
          to: `${entity.getAttribute('data-base-x')} ${entity.getAttribute('data-base-y')} ${entity.getAttribute('data-base-z')}`,
          dur: 400,
          easing: 'easeOutQuad'
        });
        entity.setAttribute('rotation', '0 0 0');
      } else {
        // Drop previous inspected item if any
        if (inspectedProductId) {
          const prev = document.getElementById(`product-${inspectedProductId}-model`);
          if (prev) {
            prev.removeAttribute('animation__spin');
            prev.setAttribute('animation__lift', {
              property: 'position',
              to: `${prev.getAttribute('data-base-x')} ${prev.getAttribute('data-base-y')} ${prev.getAttribute('data-base-z')}`,
              dur: 300,
              easing: 'easeOutQuad'
            });
            prev.setAttribute('rotation', '0 0 0');
          }
        }

        // Lift & Start 360 Spin
        inspectedProductId = productId;
        entity.setAttribute('animation__lift', {
          property: 'position',
          to: `${entity.getAttribute('data-base-x')} ${parseFloat(entity.getAttribute('data-base-y')) + 0.25} ${entity.getAttribute('data-base-z')}`,
          dur: 400,
          easing: 'easeOutQuad'
        });
        entity.setAttribute('animation__spin', {
          property: 'rotation',
          to: '0 360 0',
          dur: 6000,
          easing: 'linear',
          loop: true
        });
      }
    }

    // Dynamic Color & Size Buttons renderer
    function updateProductColorAndSizeButtons() {
      if (!selectedProductId) return;
      const p = PRODUCTS[selectedProductId];

      // Update Color Spheres
      const colorContainer = document.getElementById('color-buttons-container');
      colorContainer.innerHTML = '';
      p.colors.forEach((col, idx) => {
        const sphere = document.createElement('a-sphere');
        sphere.setAttribute('radius', '0.06');
        sphere.setAttribute('color', col.hex);
        sphere.setAttribute('position', `${(idx - (p.colors.length - 1)/2) * 0.18} 0 0.02`);
        sphere.setAttribute('vr-hoverable', '');
        sphere.setAttribute('class', 'clickable');
        
        if (col.hex === p.currentColor) {
          const ring = document.createElement('a-ring');
          ring.setAttribute('radius-inner', '0.07');
          ring.setAttribute('radius-outer', '0.085');
          ring.setAttribute('color', '#0284C7');
          ring.setAttribute('position', '0 0 0.01');
          sphere.appendChild(ring);
        }

        sphere.addEventListener('click', (e) => {
          e.stopPropagation();
          changeProductColor(col.hex);
        });
        colorContainer.appendChild(sphere);
      });

      // Update Size Buttons (S, M, L, XL)
      const sizeContainer = document.getElementById('size-buttons-container');
      sizeContainer.innerHTML = '';
      p.sizes.forEach((sz, idx) => {
        const btnGroup = document.createElement('a-entity');
        btnGroup.setAttribute('position', `${(idx - (p.sizes.length - 1)/2) * 0.18} 0 0.02`);

        const bgPlane = document.createElement('a-plane');
        bgPlane.setAttribute('width', '0.14');
        bgPlane.setAttribute('height', '0.09');
        bgPlane.setAttribute('material', {
          color: sz === p.currentSize ? '#0284C7' : '#E2E8F0',
          shader: 'flat'
        });
        bgPlane.setAttribute('vr-hoverable', '');
        bgPlane.setAttribute('class', 'clickable');

        const text = document.createElement('a-text');
        text.setAttribute('value', sz);
        text.setAttribute('align', 'center');
        text.setAttribute('color', sz === p.currentSize ? '#FFFFFF' : '#0F172A');
        text.setAttribute('scale', '0.38 0.38 0.38');
        text.setAttribute('position', '0 0 0.01');

        btnGroup.appendChild(bgPlane);
        btnGroup.appendChild(text);

        bgPlane.addEventListener('click', (e) => {
          e.stopPropagation();
          changeProductSize(sz);
        });

        sizeContainer.appendChild(btnGroup);
      });
    }

    // Change Color
    function changeProductColor(hexColor) {
      if (!selectedProductId) return;
      SoundFX.playClick();
      PRODUCTS[selectedProductId].currentColor = hexColor;

      const modelEl = document.getElementById(`product-${selectedProductId}-model`);
      if (modelEl) {
        const colorableParts = modelEl.querySelectorAll('.colorable');
        colorableParts.forEach(part => {
          part.setAttribute('color', hexColor);
        });
      }

      updateProductColorAndSizeButtons();
      renderProductInfoCanvas(selectedProductId);
    }

    // Change Size
    function changeProductSize(sizeLabel) {
      if (!selectedProductId) return;
      SoundFX.playClick();
      const p = PRODUCTS[selectedProductId];
      p.currentSize = sizeLabel;

      const scaleVal = p.sizeScales[sizeLabel] || 1.0;
      const modelEl = document.getElementById(`product-${selectedProductId}-model`);
      if (modelEl) {
        const baseScale = parseFloat(modelEl.getAttribute('data-base-scale')) || 1.0;
        const newScale = baseScale * scaleVal;
        modelEl.setAttribute('animation__rescale', {
          property: 'scale',
          to: `${newScale} ${newScale} ${newScale}`,
          dur: 300,
          easing: 'easeOutBack'
        });
      }

      updateProductColorAndSizeButtons();
      renderProductInfoCanvas(selectedProductId);
    }

    // Add to Cart
    function addToCart() {
      if (!selectedProductId) return;
      SoundFX.playAddToCart();
      const p = PRODUCTS[selectedProductId];
      const colorObj = p.colors.find(c => c.hex === p.currentColor) || p.colors[0];

      const existing = shoppingCart.find(i => i.id === p.id && i.colorHex === p.currentColor && i.size === p.currentSize);

      if (existing) {
        existing.quantity += 1;
      } else {
        shoppingCart.push({
          id: p.id,
          name: p.name,
          price: p.basePrice,
          colorHex: p.currentColor,
          colorName: colorObj.name,
          size: p.currentSize,
          quantity: 1
        });
      }

      renderCartCanvas();
      renderCheckoutCanvas();
    }

    // Clear Cart
    function clearCart() {
      SoundFX.playClick();
      shoppingCart = [];
      renderCartCanvas();
      renderCheckoutCanvas();
    }

    // Open Checkout Panel
    function openCheckoutPanel() {
      if (shoppingCart.length === 0) {
        SoundFX.playClick();
        alert('Your shopping cart is empty! Add products before checking out.');
        return;
      }
      SoundFX.playClick();
      renderCheckoutCanvas();
      document.getElementById('checkout-panel-group').setAttribute('visible', 'true');
    }

    function closeCheckoutPanel() {
      SoundFX.playClick();
      document.getElementById('checkout-panel-group').setAttribute('visible', 'false');
    }

    // Process Payment
    function processPayment() {
      if (shoppingCart.length === 0) return;

      SoundFX.playSuccess();

      let subtotal = 0;
      const itemsSummary = JSON.parse(JSON.stringify(shoppingCart));
      shoppingCart.forEach(item => {
        subtotal += item.price * item.quantity;
      });
      const grandTotal = subtotal * (1 + TAX_RATE);

      const orderId = '#VR-' + Math.floor(100000 + Math.random() * 900000);

      // Render Receipt Success Panel
      renderSuccessCanvas(orderId, itemsSummary, grandTotal);

      document.getElementById('checkout-panel-group').setAttribute('visible', 'false');
      document.getElementById('success-panel-group').setAttribute('visible', 'true');

      const confettiSys = document.getElementById('confetti-container').components['confetti-burst'];
      if (confettiSys) {
        confettiSys.trigger();
      }

      // Reset Cart
      shoppingCart = [];
      renderCartCanvas();
    }

    function closeSuccessPanel() {
      SoundFX.playClick();
      document.getElementById('success-panel-group').setAttribute('visible', 'false');
    }

    // Quick Fill for Quest Users
    function setPresetCard() {
      SoundFX.playClick();
      cardState = {
        name: 'QUEST USER',
        number: '4242 •••• •••• 4242',
        expiry: '09/29',
        cvv: '999'
      };
      renderCheckoutCanvas();
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Pre-render canvases
      selectProduct('shirt');
      renderCartCanvas();
      renderCheckoutCanvas();
    });
  </script>
</head>

      </a-plane>

      <!-- Interactive 3D Color Spheres Container -->
      <a-entity id="color-buttons-container" position="0 -0.04 0.02"></a-entity>

      <!-- Interactive 3D Size Buttons Container (S, M, L, XL) -->
      <a-entity id="size-buttons-container" position="0 -0.22 0.02"></a-entity>

      <!-- ADD TO CART BUTTON -->
      <a-entity position="0 -0.4 0.03">
        <a-plane 
          width="0.7" 
          height="0.13" 
          color="#0284C7" 
          class="clickable" 
          vr-hoverable 
          onclick="addToCart()">
          <a-text value="🛒 ADD TO CART" align="center" color="#FFFFFF" scale="0.48 0.48 0.48" position="0 0 0.01"></a-text>
        </a-plane>
      </a-entity>
    </a-entity>

    <!-- 2. SHOPPING CART FLOATING PANEL (Anchored on Right Side) -->
    <a-entity id="cart-panel-group" position="1.8 1.8 -1.5" billboard-y>
      <a-plane 
        id="cart-panel-plane" 
        width="1.25" 
        height="1.25" 
        position="0 0 0" 
        material="shader: flat; transparent: true">
      </a-plane>

      <!-- Clear Cart Button -->
      <a-entity position="-0.3 -0.48 0.03">
        <a-plane width="0.38" height="0.1" color="#EF4444" class="clickable" vr-hoverable onclick="clearCart()">
          <a-text value="CLEAR CART" align="center" color="#FFFFFF" scale="0.32 0.32 0.32" position="0 0 0.01"></a-text>
        </a-plane>
      </a-entity>

      <!-- Checkout Button -->
      <a-entity position="0.24 -0.48 0.03">
        <a-plane width="0.52" height="0.12" color="#16A34A" class="clickable" vr-hoverable onclick="openCheckoutPanel()">
          <a-text value="CHECKOUT ➔" align="center" color="#FFFFFF" scale="0.42 0.42 0.42" position="0 0 0.01"></a-text>
        </a-plane>
      </a-entity>
    </a-entity>

    <!-- 3. CHECKOUT & CARD PAYMENT MODAL PANEL (Center Floating) -->
    <a-entity id="checkout-panel-group" position="0 1.85 -1.2" billboard-y visible="false">
      <a-plane width="3" height="3" position="0 0 -0.05" color="#0F172A" material="opacity: 0.5; transparent: true"></a-plane>

      <a-plane 
        id="checkout-panel-plane" 
        width="1.3" 
        height="1.3" 
        position="0 0 0" 
        material="shader: flat; transparent: true">
      </a-plane>

      <!-- VR Preset Fill -->
      <a-entity position="0 0.35 0.03">
        <a-plane width="0.4" height="0.08" color="#0284C7" class="clickable" vr-hoverable onclick="setPresetCard()">
          <a-text value="⚡ Fill Quest Card" align="center" color="#FFFFFF" scale="0.28 0.28 0.28" position="0 0 0.01"></a-text>
        </a-plane>
      </a-entity>

      <!-- Cancel Button -->
      <a-entity position="-0.3 -0.5 0.03">
        <a-plane width="0.42" height="0.12" color="#64748B" class="clickable" vr-hoverable onclick="closeCheckoutPanel()">
          <a-text value="CANCEL" align="center" color="#FFFFFF" scale="0.38 0.38 0.38" position="0 0 0.01"></a-text>
        </a-plane>
      </a-entity>

      <!-- PAY NOW BUTTON -->
      <a-entity position="0.3 -0.5 0.03">
        <a-plane width="0.5" height="0.13" color="#16A34A" class="clickable" vr-hoverable onclick="processPayment()">
          <a-text value="💳 PAY NOW" align="center" color="#FFFFFF" scale="0.48 0.48 0.48" position="0 0 0.01"></a-text>
        </a-plane>
      </a-entity>
    </a-entity>

    <!-- 4. RECEIPT SUMMARY & SUCCESS PANEL -->
    <a-entity id="success-panel-group" position="0 1.85 -1.1" billboard-y visible="false">
      <a-plane 
        id="success-panel-plane" 
        width="1.3" 
        height="1.3" 
        position="0 0 0" 
        material="shader: flat; transparent: true">
      </a-plane>

      <!-- Close Button -->
      <a-entity position="0 -0.46 0.03">
        <a-plane width="0.68" height="0.13" color="#16A34A" class="clickable" vr-hoverable onclick="closeSuccessPanel()">
          <a-text value="🛍️ CONTINUE SHOPPING" align="center" color="#FFFFFF" scale="0.42 0.42 0.42" position="0 0 0.01"></a-text>
        </a-plane>
      </a-entity>
    </a-entity>

    <!-- CONFETTI CONTAINER SYSTEM -->
    <a-entity id="confetti-container" confetti-burst></a-entity>

  </a-scene>

</body>
</html>
