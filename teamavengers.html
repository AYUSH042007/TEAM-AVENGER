<!DOCTYPE html>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #050508;

    /* 2D Desktop HUD Overlay */
    #desktop-hud {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 999;
      background: rgba(15, 20, 32, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }
    #desktop-hud h1 {
      margin: 0 0 4px 0;
      font-size: 16px;
      color: #64B5F6;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    #desktop-hud p {
      margin: 0;
      font-size: 12px;
      color: #B0BEC5;
    }

    /* Crosshair for non-VR Desktop mode */
    #cursor-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 998;
      box-shadow: 0 0 8px rgba(100, 181, 246, 0.8);
    }

    /* Hidden Canvas elements for dynamic UI texture generation */
    .hidden-canvas-container {
      display: none;
    }

  <script>
    /* =========================================================================
       WEB AUDIO API SYNTHESIZER (No external audio files needed)
       ========================================================================= */
    const SoundFX = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      },
      playClick() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch(e) {}
      },
      playAddToCart() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now); // A4
          osc.frequency.setValueAtTime(554.37, now + 0.08); // C#5
          osc.frequency.setValueAtTime(659.25, now + 0.16); // E5
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        } catch(e) {}
      },
      playSuccess() {
        try {
          this.init();
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const startTime = this.ctx.currentTime + i * 0.09;
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.25, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.35);
          });
        } catch(e) {}
      }
    };

    /* =========================================================================
       DYNAMIC 2D CANVAS TEXTURE GENERATORS FOR Crisp 3D VR UI PANELS
       ========================================================================= */

    function createRoundedRectPath(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // 1. PRODUCT DETAIL PANEL CANVAS
    function renderProductInfoCanvas(productId) {
      const p = PRODUCTS[productId];
      const canvas = document.getElementById('canvas-product-info') || document.createElement('canvas');
      canvas.id = 'canvas-product-info';
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // Glassmorphism Background
      ctx.clearRect(0, 0, 1024, 1024);
      const bgGrad = ctx.createLinearGradient(0, 0, 0, 1024);
      bgGrad.addColorStop(0, 'rgba(15, 23, 42, 0.95)');
      bgGrad.addColorStop(1, 'rgba(30, 41, 59, 0.95)');
      
      ctx.fillStyle = bgGrad;
      createRoundedRectPath(ctx, 20, 20, 984, 984, 40);
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(100, 181, 246, 0.6)';
      ctx.stroke();

      // Title & Price Header
      ctx.fillStyle = '#64B5F6';
      ctx.font = 'bold 44px Segoe UI, sans-serif';
      ctx.fillText('PRODUCT SPECIFICATIONS', 60, 90);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 56px Segoe UI, sans-serif';
      ctx.fillText(p.name, 60, 165);

      ctx.fillStyle = '#00E676';
      ctx.font = 'bold 64px Segoe UI, sans-serif';
      ctx.fillText(`₹${p.basePrice.toLocaleString('en-IN')}`, 60, 245);

      // Specs Divider
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(60, 280);
      ctx.lineTo(964, 280);
      ctx.stroke();

      // Active Color & Size Readout
      const scale = p.sizeScales[p.currentSize] || 1.0;
      const dimW = Math.round(p.baseDimensions.w * scale);
      const dimH = Math.round(p.baseDimensions.h * scale);
      const dimD = Math.round(p.baseDimensions.d * scale);

      const colorObj = p.colors.find(c => c.hex === p.currentColor) || p.colors[0];

      ctx.fillStyle = '#B0BEC5';
      ctx.font = '36px Segoe UI, sans-serif';
      ctx.fillText(`Selected Color:`, 60, 350);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 36px Segoe UI, sans-serif';
      ctx.fillText(`${colorObj.name}`, 330, 350);

      ctx.fillStyle = '#B0BEC5';
      ctx.font = '36px Segoe UI, sans-serif';
      ctx.fillText(`Selected Size:`, 60, 410);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 36px Segoe UI, sans-serif';
      ctx.fillText(`${p.currentSize}`, 330, 410);

      ctx.fillStyle = '#B0BEC5';
      ctx.font = '36px Segoe UI, sans-serif';
      ctx.fillText(`Dimensions:`, 60, 470);
      ctx.fillStyle = '#FFD54F';
      ctx.font = 'bold 36px Segoe UI, sans-serif';
      ctx.fillText(`${dimW} × ${dimH} × ${dimD} cm`, 330, 470);

      // Section: COLOR SELECTION CONTROLS
      ctx.fillStyle = '#E0E0E0';
      ctx.font = 'bold 38px Segoe UI, sans-serif';
      ctx.fillText('COLOR OPTION', 60, 545);

      // Section: SIZE SELECTION CONTROLS
      ctx.fillStyle = '#E0E0E0';
      ctx.font = 'bold 38px Segoe UI, sans-serif';
      ctx.fillText('SIZE OPTION', 60, 705);

      // Update A-Frame Texture
      updateAFrameTexture('#product-info-panel-plane', canvas);
    }

    // 2. SHOPPING CART CANVAS
    function renderCartCanvas() {
      const canvas = document.getElementById('canvas-cart') || document.createElement('canvas');
      canvas.id = 'canvas-cart';
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, 1024, 1024);

      // Panel Background
      const bgGrad = ctx.createLinearGradient(0, 0, 0, 1024);
      bgGrad.addColorStop(0, 'rgba(15, 23, 42, 0.96)');
      bgGrad.addColorStop(1, 'rgba(23, 32, 54, 0.96)');
      ctx.fillStyle = bgGrad;
      createRoundedRectPath(ctx, 20, 20, 984, 984, 40);
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(0, 230, 118, 0.5)';
      ctx.stroke();

      // Header
      ctx.fillStyle = '#00E676';
      ctx.font = 'bold 50px Segoe UI, sans-serif';
      ctx.fillText('🛒 SHOPPING CART', 60, 95);

      let subtotal = 0;
      let totalTax = 0;

      if (shoppingCart.length === 0) {
        ctx.fillStyle = '#90A4AE';
        ctx.font = '40px Segoe UI, sans-serif';
        ctx.fillText('Your cart is empty.', 60, 200);
        ctx.fillText('Select a product on the display table', 60, 260);
        ctx.fillText('and click "ADD TO CART".', 60, 320);
      } else {
        let yPos = 160;
        shoppingCart.forEach((item, index) => {
          if (index >= 4) return; // Display max 4 rows cleanly

          const itemBasePrice = item.price * item.quantity;
          const itemTax = itemBasePrice * TAX_RATE;
          const itemTotal = itemBasePrice + itemTax;

          subtotal += itemBasePrice;
          totalTax += itemTax;

          // Item Container Card
          ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
          createRoundedRectPath(ctx, 50, yPos, 924, 120, 16);
          ctx.fill();

          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 34px Segoe UI, sans-serif';
          ctx.fillText(`${item.name}`, 75, yPos + 45);

          ctx.fillStyle = '#B0BEC5';
          ctx.font = '28px Segoe UI, sans-serif';
          ctx.fillText(`Color: ${item.colorName}  |  Size: ${item.size}`, 75, yPos + 88);

          // Pricing
          ctx.fillStyle = '#81C784';
          ctx.font = 'bold 32px Segoe UI, sans-serif';
          ctx.fillText(`₹${item.price} × ${item.quantity} = ₹${itemBasePrice}`, 480, yPos + 48);

          ctx.fillStyle = '#FFB74D';
          ctx.font = '26px Segoe UI, sans-serif';
          ctx.fillText(`Tax(3%): ₹${itemTax.toFixed(2)}  ➔ Total: ₹${itemTotal.toFixed(2)}`, 480, yPos + 88);

          yPos += 135;
        });
      }

      // Summary Calculations
      const grandTotal = subtotal + totalTax;

      // Divider Line
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(50, 730);
      ctx.lineTo(974, 730);
      ctx.stroke();

      // Financial Breakdown
      ctx.fillStyle = '#CFD8DC';
      ctx.font = '32px Segoe UI, sans-serif';
      ctx.fillText(`Cart Subtotal:`, 60, 780);
      ctx.fillText(`₹${subtotal.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`, 400, 780);

      ctx.fillText(`Total Tax (3%):`, 60, 830);
      ctx.fillText(`₹${totalTax.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`, 400, 830);

      ctx.fillStyle = '#00E676';
      ctx.font = 'bold 44px Segoe UI, sans-serif';
      ctx.fillText(`GRAND TOTAL:`, 60, 900);
      ctx.fillText(`₹${grandTotal.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`, 400, 900);

      updateAFrameTexture('#cart-panel-plane', canvas);
    }

    // 3. CHECKOUT & CARD PAYMENT CANVAS
    function renderCheckoutCanvas() {
      const canvas = document.getElementById('canvas-checkout') || document.createElement('canvas');

      bgGrad.addColorStop(1, 'rgba(30, 41, 59, 0.97)');

      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(30, 136, 229, 0.7)';

      ctx.font = 'bold 48px Segoe UI, sans-serif';
      ctx.fillText('💳 CHECKOUT & PAYMENT', 60, 90);

      // Calculate totals
      let subtotal = 0;
      let totalTax = 0;
      let itemCount = 0;
      shoppingCart.forEach(item => {
        const itemBase = item.price * item.quantity;
        subtotal += itemBase;
        totalTax += itemBase * TAX_RATE;
        itemCount += item.quantity;
      });
      const grandTotal = subtotal + totalTax;

      // Summary Box
      ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
      createRoundedRectPath(ctx, 60, 120, 904, 140, 20);
      ctx.fill();

      ctx.fillStyle = '#ECEFF1';
      ctx.font = '30px Segoe UI, sans-serif';
      ctx.fillText(`Items Count: ${itemCount}`, 90, 170);
      ctx.fillText(`Subtotal: ₹${subtotal.toFixed(2)}`, 450, 170);

      ctx.fillText(`Tax (3%): ₹${totalTax.toFixed(2)}`, 90, 225);
      ctx.fillStyle = '#00E676';
      ctx.font = 'bold 36px Segoe UI, sans-serif';
      ctx.fillText(`Final Payable: ₹${grandTotal.toFixed(2)}`, 450, 225);

      // Form Field Labels & Mock Inputs
      ctx.fillStyle = '#B0BEC5';
      ctx.font = 'bold 30px Segoe UI, sans-serif';
      ctx.fillText('CARDHOLDER NAME', 60, 310);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';

      ctx.font = 'bold 30px Segoe UI, sans-serif';

      ctx.fill();
      ctx.fillStyle = '#FFD54F';
      ctx.font = '32px monospace';
      ctx.fillText(cardState.number, 90, 505);

      // Expiry & CVV side by side
      ctx.fillStyle = '#B0BEC5';
      ctx.font = 'bold 30px Segoe UI, sans-serif';
      ctx.fillText('EXPIRY DATE', 60, 570);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      createRoundedRectPath(ctx, 60, 585, 430, 75, 12);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '32px monospace';
      ctx.fillText(cardState.expiry, 90, 635);

      ctx.fillStyle = '#B0BEC5';
      ctx.font = 'bold 30px Segoe UI, sans-serif';
      ctx.fillText('CVV CODE', 534, 570);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      createRoundedRectPath(ctx, 534, 585, 430, 75, 12);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '32px monospace';
      ctx.fillText(cardState.cvv, 564, 635);

      // Security Note
      ctx.fillStyle = '#78909C';
      ctx.font = '24px Segoe UI, sans-serif';
      ctx.fillText('🔒 Encrypted 256-Bit WebXR Simulated Payment Interface', 60, 700);

      updateAFrameTexture('#checkout-panel-plane', canvas);
    }

    // Helper to assign canvas texture to A-Frame plane material
    function updateAFrameTexture(planeSelector, canvas) {
      const plane = document.querySelector(planeSelector);
      if (!plane) return;

      let texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;

      const mesh = plane.getObject3D('mesh');
      if (mesh && mesh.material) {
        mesh.material.map = texture;
        mesh.material.transparent = true;
        mesh.material.needsUpdate = true;
      }
    }

    /* =========================================================================
       A-FRAME CUSTOM COMPONENTS
       ========================================================================= */

    // 1. BILLBOARD COMPONENT (Smooth Y-axis rotation to face user camera)
    AFRAME.registerComponent('billboard-y', {
      tick: function () {
        const cameraEl = this.el.sceneEl.camera;
        if (!cameraEl) return;
        const camPos = cameraEl.el.object3D.position;
        const targetPos = new THREE.Vector3(camPos.x, this.el.object3D.position.y, camPos.z);
        this.el.object3D.lookAt(targetPos);
      }
    });

    // 2. HOVER EFFECT COMPONENT (Highlights product & buttons on pointer enter)
    AFRAME.registerComponent('vr-hoverable', {
      schema: { scaleFactor: { type: 'number', default: 1.08 } },
      init: function () {
        const el = this.el;
        const defaultScale = el.getAttribute('scale') || { x: 1, y: 1, z: 1 };
        this.originalScale = { ...defaultScale };

        el.addEventListener('mouseenter', () => {
          SoundFX.playClick();
          el.setAttribute('animation__hover', {
            property: 'scale',
            to: `${this.originalScale.x * this.data.scaleFactor} ${this.originalScale.y * this.data.scaleFactor} ${this.originalScale.z * this.data.scaleFactor}`,
            dur: 200,
            easing: 'easeOutQuad'
          });
        });

        el.addEventListener('mouseleave', () => {
          el.setAttribute('animation__hover', {
            property: 'scale',
            to: `${this.originalScale.x} ${this.originalScale.y} ${this.originalScale.z}`,
            dur: 200,
            easing: 'easeOutQuad'
          });
        });
      }
    });

    // 3. 3D CONFETTI PARTICLE SYSTEM FOR PURCHASE CELEBRATION
    AFRAME.registerComponent('confetti-burst', {
      init: function () {
        this.particles = [];
        this.active = false;
      },
      trigger: function () {
        this.active = true;
        const count = 120;
        const colors = ['#00E676', '#64B5F6', '#FFD54F', '#FF4081', '#E040FB', '#FFFFFF'];
        
        for (let i = 0; i < count; i++) {
          const geom = new THREE.PlaneGeometry(0.08, 0.08);
          const mat = new THREE.MeshBasicMaterial({
            color: new THREE.Color(colors[Math.floor(Math.random() * colors.length)]),
            side: THREE.DoubleSide
          });
          const p = new THREE.Mesh(geom, mat);
          
          p.position.set(
            (Math.random() - 0.5) * 1.5,
            2.2 + Math.random() * 0.5,
            -2.5 + (Math.random() - 0.5) * 1.5
          );

          p.velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 3,
            2 + Math.random() * 3,
            (Math.random() - 0.5) * 3
          );

          p.rotVelocity = new THREE.Vector3(
            Math.random() * 10,
            Math.random() * 10,
            Math.random() * 10
          );

          this.el.object3D.add(p);
          this.particles.push(p);
        }

        setTimeout(() => {
          this.cleanup();
        }, 4000);
      },
      tick: function (time, delta) {
        if (!this.active) return;
        const dt = delta / 1000;
        this.particles.forEach(p => {
          p.position.addScaledVector(p.velocity, dt);
          p.velocity.y -= 4.8 * dt; // Gravity
          p.rotation.x += p.rotVelocity.x * dt;
          p.rotation.y += p.rotVelocity.y * dt;
        });
      },
      cleanup: function () {
        this.active = false;
        this.particles.forEach(p => {
          this.el.object3D.remove(p);
          p.geometry.dispose();
          p.material.dispose();
        });
        this.particles = [];
      }
    });

    /* =========================================================================
       BUSINESS LOGIC & INTERACTION HANDLERS
       ========================================================================= */

    // Select Product on Display Stand
    function selectProduct(productId) {
      SoundFX.playClick();
      selectedProductId = productId;

      // Reset all product positions & rotation state
      ['shirt', 'shoes', 'jeans'].forEach(id => {
        const entity = document.getElementById(`product-${id}-model`);
        const infoPedestal = document.getElementById(`pedestal-${id}`);
        if (entity) {
          if (id === productId) {
            // Lift slightly & rotate
            entity.setAttribute('animation__lift', {
              property: 'position',
              to: `${entity.getAttribute('data-base-x')} ${parseFloat(entity.getAttribute('data-base-y')) + 0.18} ${entity.getAttribute('data-base-z')}`,
              dur: 400,
              easing: 'easeOutQuad'
            });
            entity.setAttribute('animation__spin', {
              property: 'rotation',
              to: '0 360 0',
              dur: 8000,
              easing: 'linear',
              loop: true
            });
          } else {
            // Return to table
            entity.removeAttribute('animation__spin');
            entity.setAttribute('animation__lift', {
              property: 'position',
              to: `${entity.getAttribute('data-base-x')} ${entity.getAttribute('data-base-y')} ${entity.getAttribute('data-base-z')}`,
              dur: 400,
              easing: 'easeOutQuad'
            });
            entity.setAttribute('rotation', '0 0 0');
          }
        }
      });

      // Show Product Info Panel & update dynamic controls
      const panelGroup = document.getElementById('product-info-panel-group');
      if (panelGroup) {
        panelGroup.setAttribute('visible', 'true');
      }

      updateProductColorAndSizeButtons();
      renderProductInfoCanvas(productId);
    }

    // Dynamic 3D Color & Size Buttons update
    function updateProductColorAndSizeButtons() {
      if (!selectedProductId) return;
      const p = PRODUCTS[selectedProductId];

      // Update Color Spheres
      const colorContainer = document.getElementById('color-buttons-container');
      colorContainer.innerHTML = '';
      p.colors.forEach((col, idx) => {
        const sphere = document.createElement('a-sphere');
        sphere.setAttribute('radius', '0.06');
        sphere.setAttribute('color', col.hex);
        sphere.setAttribute('position', `${(idx - (p.colors.length - 1)/2) * 0.18} 0 0.02`);
        sphere.setAttribute('vr-hoverable', '');
        sphere.setAttribute('class', 'clickable');
        
        // Highlight active color ring
        if (col.hex === p.currentColor) {
          const ring = document.createElement('a-ring');
          ring.setAttribute('radius-inner', '0.07');
          ring.setAttribute('radius-outer', '0.085');
          ring.setAttribute('color', '#00E676');
          ring.setAttribute('position', '0 0 0.01');
          sphere.appendChild(ring);
        }

        sphere.addEventListener('click', () => {
          changeProductColor(col.hex);
        });
        colorContainer.appendChild(sphere);
      });

      // Update Size Buttons
      const sizeContainer = document.getElementById('size-buttons-container');
      sizeContainer.innerHTML = '';
      p.sizes.forEach((sz, idx) => {
        const btnGroup = document.createElement('a-entity');
        btnGroup.setAttribute('position', `${(idx - (p.sizes.length - 1)/2) * 0.18} 0 0.02`);

        const bgPlane = document.createElement('a-plane');
        bgPlane.setAttribute('width', '0.14');
        bgPlane.setAttribute('height', '0.09');
        bgPlane.setAttribute('material', {
          color: sz === p.currentSize ? '#00E676' : '#263238',
          shader: 'flat'
        });
        bgPlane.setAttribute('vr-hoverable', '');
        bgPlane.setAttribute('class', 'clickable');

        const text = document.createElement('a-text');
        text.setAttribute('value', sz);
        text.setAttribute('align', 'center');
        text.setAttribute('color', sz === p.currentSize ? '#000000' : '#FFFFFF');
        text.setAttribute('scale', '0.35 0.35 0.35');
        text.setAttribute('position', '0 0 0.01');

        btnGroup.appendChild(bgPlane);
        btnGroup.appendChild(text);

        bgPlane.addEventListener('click', () => {
          changeProductSize(sz);
        });

        sizeContainer.appendChild(btnGroup);
      });
    }

    // Change Color action
    function changeProductColor(hexColor) {
      if (!selectedProductId) return;
      SoundFX.playClick();
      PRODUCTS[selectedProductId].currentColor = hexColor;

      // Apply material color change to 3D model meshes
      const modelEl = document.getElementById(`product-${selectedProductId}-model`);
      if (modelEl) {
        const colorableParts = modelEl.querySelectorAll('.colorable');
        colorableParts.forEach(part => {
          part.setAttribute('color', hexColor);
        });
      }

      updateProductColorAndSizeButtons();
      renderProductInfoCanvas(selectedProductId);
    }

    // Change Size action
    function changeProductSize(sizeLabel) {
      if (!selectedProductId) return;
      SoundFX.playClick();
      const p = PRODUCTS[selectedProductId];
      p.currentSize = sizeLabel;

      // Scale 3D Model slightly
      const scaleVal = p.sizeScales[sizeLabel] || 1.0;
      const modelEl = document.getElementById(`product-${selectedProductId}-model`);
      if (modelEl) {
        const baseScale = parseFloat(modelEl.getAttribute('data-base-scale')) || 1.0;
        const newScale = baseScale * scaleVal;
        modelEl.setAttribute('animation__rescale', {
          property: 'scale',
          to: `${newScale} ${newScale} ${newScale}`,
          dur: 300,
          easing: 'easeOutBack'
        });
      }

      updateProductColorAndSizeButtons();
      renderProductInfoCanvas(selectedProductId);
    }

    // Add Selected Item to Shopping Cart
    function addToCart() {
      if (!selectedProductId) return;
      SoundFX.playAddToCart();
      const p = PRODUCTS[selectedProductId];
      const colorObj = p.colors.find(c => c.hex === p.currentColor) || p.colors[0];

      // Check if item with same ID, color, and size exists
      const existing = shoppingCart.find(i => i.id === p.id && i.colorHex === p.currentColor && i.size === p.currentSize);

      if (existing) {
        existing.quantity += 1;
      } else {
        shoppingCart.push({
          id: p.id,
          name: p.name,
          price: p.basePrice,
          colorHex: p.currentColor,
          colorName: colorObj.name,
          size: p.currentSize,
          quantity: 1
        });
      }

      renderCartCanvas();
      renderCheckoutCanvas();
    }

    // Adjust Quantity (+ or -)
    function updateCartQuantity(index, delta) {
      SoundFX.playClick();
      if (shoppingCart[index]) {
        shoppingCart[index].quantity += delta;
        if (shoppingCart[index].quantity <= 0) {
          shoppingCart.splice(index, 1);
        }
      }
      renderCartCanvas();
      renderCheckoutCanvas();
    }

    // Clear / Reset Cart
    function clearCart() {
      SoundFX.playClick();
      shoppingCart = [];
      renderCartCanvas();
      renderCheckoutCanvas();
    }

    // Show Checkout Panel
    function openCheckoutPanel() {
      if (shoppingCart.length === 0) {
        SoundFX.playClick();
        alert('Your shopping cart is empty! Please add products before checking out.');
        return;
      }
      SoundFX.playClick();
      renderCheckoutCanvas();
      document.getElementById('checkout-panel-group').setAttribute('visible', 'true');
    }

    function closeCheckoutPanel() {
      SoundFX.playClick();
      document.getElementById('checkout-panel-group').setAttribute('visible', 'false');
    }

    // Pay Now Action
    function processPayment() {
      if (shoppingCart.length === 0) return;

      SoundFX.playSuccess();

      // Calculate total paid
      let subtotal = 0;
      shoppingCart.forEach(item => {
        subtotal += item.price * item.quantity;
      });
      const grandTotal = subtotal * (1 + TAX_RATE);

      const orderId = '#VR-' + Math.floor(100000 + Math.random() * 900000);

      // Render Order Success Panel
      renderSuccessCanvas(orderId, grandTotal);

      // Hide Checkout Panel, Show Success Panel
      document.getElementById('checkout-panel-group').setAttribute('visible', 'false');
      document.getElementById('success-panel-group').setAttribute('visible', 'true');

      // Trigger Confetti Explosion
      const confettiSys = document.getElementById('confetti-container').components['confetti-burst'];
      if (confettiSys) {
        confettiSys.trigger();
      }

      // Empty Cart after purchase
      shoppingCart = [];
      renderCartCanvas();
    }

    function closeSuccessPanel() {
      SoundFX.playClick();
      document.getElementById('success-panel-group').setAttribute('visible', 'false');
    }

    // Card Autofill preset handler for easy VR controller interaction
    function setPresetCard(type) {
      SoundFX.playClick();
      if (type === 'meta') {
        cardState = {
          name: 'QUEST USER',
          number: '4242 •••• •••• 4242',
          expiry: '09/29',
          cvv: '999'
        };
      } else {
        cardState = {
          name: 'AYUSH SHARMA',
          number: '4532 8912 3456 9012',
          expiry: '12/28',
          cvv: '888'
        };
      }
      renderCheckoutCanvas();
    }

    // Initialize scenes on window load
    window.addEventListener('DOMContentLoaded', () => {
      // Pre-render initial textures
      renderCartCanvas();
      renderCheckoutCanvas();
    });
  </script>

          vr-hoverable 
          onclick="addToCart()">
          <a-text value="🛒 ADD TO CART" align="center" color="#000000" scale="0.5 0.5 0.5" position="0 0 0.01"></a-text>
        </a-plane>
      </a-entity>
    </a-entity>

    <!-- 2. SHOPPING CART FLOATING PANEL (Positioned on the Right Side) -->
    <a-entity id="cart-panel-group" position="1.6 1.8 -1.6" billboard-y>
      <!-- Main Cart Texture Plane -->
      <a-plane 
        id="cart-panel-plane" 
        width="1.3" 
        height="1.3" 
        position="0 0 0" 
        material="shader: flat; transparent: true">
      </a-plane>

      <!-- 3D Interactive Buttons on Cart Panel -->
      
      <!-- Clear Cart Button -->
      <a-entity position="-0.32 -0.5 0.03">
        <a-plane width="0.4" height="0.1" color="#EF5350" class="clickable" vr-hoverable onclick="clearCart()">
          <a-text value="CLEAR CART" align="center" color="#FFFFFF" scale="0.32 0.32 0.32" position="0 0 0.01"></a-text>
        </a-plane>
      </a-entity>

      <!-- Proceed to Checkout Button -->
      <a-entity position="0.25 -0.5 0.03">
        <a-plane width="0.55" height="0.12" color="#00E676" class="clickable" vr-hoverable onclick="openCheckoutPanel()">
          <a-text value="CHECKOUT ➔" align="center" color="#000000" scale="0.45 0.45 0.45" position="0 0 0.01"></a-text>
        </a-plane>
      </a-entity>
    </a-entity>

    <!-- 3. CHECKOUT & CARD PAYMENT MODAL PANEL (Center Floating) -->
    <a-entity id="checkout-panel-group" position="0 1.8 -1.2" billboard-y visible="false">
      <!-- Background Backdrop Dimmer -->
      <a-plane width="3" height="3" position="0 0 -0.05" color="#000000" material="opacity: 0.7; transparent: true"></a-plane>

      <!-- Main Payment Canvas Texture Plane -->
      <a-plane 
        id="checkout-panel-plane" 
        width="1.35" 
        height="1.35" 
        position="0 0 0" 
        material="shader: flat; transparent: true">
      </a-plane>

      <!-- Quick Autofill Presets for VR Users -->
      <a-entity position="0 0.36 0.03">
        <a-plane width="0.42" height="0.08" color="#0284C7" class="clickable" vr-hoverable onclick="setPresetCard('meta')">
          <a-text value="⚡ Quick Fill Quest Card" align="center" color="#FFFFFF" scale="0.28 0.28 0.28" position="0 0 0.01"></a-text>
        </a-plane>
      </a-entity>

      <!-- Action Buttons -->

      <!-- Cancel Button -->
      <a-entity position="-0.32 -0.52 0.03">
        <a-plane width="0.45" height="0.12" color="#455A64" class="clickable" vr-hoverable onclick="closeCheckoutPanel()">
          <a-text value="CANCEL" align="center" color="#FFFFFF" scale="0.4 0.4 0.4" position="0 0 0.01"></a-text>
        </a-plane>
      </a-entity>

      <!-- PAY NOW BUTTON -->
      <a-entity position="0.32 -0.52 0.03">
        <a-plane width="0.52" height="0.14" color="#00E676" class="clickable" vr-hoverable onclick="processPayment()">
          <a-text value="💳 PAY NOW" align="center" color="#000000" scale="0.5 0.5 0.5" position="0 0 0.01"></a-text>
        </a-plane>
      </a-entity>
    </a-entity>

    <!-- 4. PURCHASE SUCCESS CELEBRATION PANEL -->
    <a-entity id="success-panel-group" position="0 1.8 -1.1" billboard-y visible="false">
      <!-- Main Success Canvas Plane -->
      <a-plane 
        id="success-panel-plane" 
        width="1.35" 
        height="1.35" 
        position="0 0 0" 
        material="shader: flat; transparent: true">
      </a-plane>

      <!-- Close & Continue Shopping Button -->
      <a-entity position="0 -0.48 0.03">
        <a-plane width="0.7" height="0.14" color="#00E676" class="clickable" vr-hoverable onclick="closeSuccessPanel()">
          <a-text value="🛍️ CONTINUE SHOPPING" align="center" color="#000000" scale="0.45 0.45 0.45" position="0 0 0.01"></a-text>
        </a-plane>
      </a-entity>
    </a-entity>

    <!-- CONFETTI CONTAINER SYSTEM -->
    <a-entity id="confetti-container" confetti-burst></a-entity>

  </a-scene>

</body>
</html>
